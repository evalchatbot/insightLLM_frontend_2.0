name: CI

on:
  push:
    branches: [dev, deployment, production]
  pull_request:
    branches: [dev, deployment, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: ESLint (errors fail, warnings capped)
        run: npm run lint

      - name: TypeScript (app + tests)
        run: npm run typecheck

      - name: Summary
        if: always()
        run: |
          echo "### Lint & typecheck: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: Unit, API & component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Vitest with coverage
        run: npm run test:coverage

      - name: Summary
        if: always()
        run: node tests/ci/step-summary.cjs vitest >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-junit
          path: test-results/vitest-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  build-e2e:
    name: Build & E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # next build with the fake, hermetic env from tests/e2e/test-env.cjs
      - name: Build (dummy env)
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Starts `next start` itself (see playwright.config.ts); external hosts are blocked.
      - name: Playwright
        run: npm run test:e2e

      - name: Summary
        if: always()
        run: node tests/ci/step-summary.cjs playwright >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7
